<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마케팅추진센터 업무 알림</title>
    <style>
        body {
            font-family: Arial, "Noto Sans KR", sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
            line-height: 1.7;
        }

        h1 {
            font-size: 26px;
        }

        .box {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .notice {
            color: #555;
        }
    </style>
</head>

<body>

    <h1>마케팅추진센터 업무 알림</h1>

    <div class="box">
        <h2>보도자료 · 뉴스 · 입찰공고 자동 알림</h2>

        <p>
            업무 관련 주요 보도자료, 뉴스 및 입찰공고를
            자동으로 수집하여 안내하고 있습니다.
        </p>

        <p class="notice">
            상세 수집 내용은 이메일을 확인해 주세요.
        </p>
    </div>

</body>
</html>
